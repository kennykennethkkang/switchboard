name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Tests hash kit files byte for byte; keep LF on Windows too.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:root
      - run: pnpm --dir extension test
      - run: pnpm --dir extension lint && pnpm --dir extension run lint:test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./extension/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.exists == 'false'
        working-directory: extension
        run: npx -y @vscode/vsce@3 package --no-dependencies
      - if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          VSIX=$(find extension -maxdepth 1 -name '*.vsix' -print -quit)
          test -n "$VSIX"
          sha256sum "$VSIX" > "$VSIX.sha256"
          awk -v version="$VERSION" '
            $0 == "## " version { printing=1 }
            printing && /^## / && $0 != "## " version { exit }
            printing { print }
          ' extension/CHANGELOG.md > release-notes.md
          test -s release-notes.md
          echo "vsix=$VSIX" >> "$GITHUB_ENV"
      - if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" "$vsix" "$vsix.sha256" --title "Switchboard v$VERSION" --notes-file release-notes.md
